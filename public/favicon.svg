<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient: Deep midnight navy base -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1738"/>
      <stop offset="50%" stop-color="#0A0F2E"/>
      <stop offset="100%" stop-color="#05081A"/>
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C2FF"/>
      <stop offset="60%" stop-color="#0090E7"/>
      <stop offset="100%" stop-color="#0052CC"/>
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C2FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#1A2656" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00C2FF" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00C2FF" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect x="2" y="2" width="116" height="116" rx="28" fill="url(#favBg)"/>
  <rect x="2" y="2" width="116" height="116" rx="28" fill="none" stroke="url(#favBorder)" stroke-width="2"/>

  <!-- Shield Shape Outline -->
  <path d="M 60 18 L 92 28 C 92 64 60 96 60 96 C 60 96 28 64 28 28 Z" 
        fill="#0A0F2E" 
        stroke="url(#favCyan)" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="url(#favGlow)"/>

  <!-- Upward Arrow in Center -->
  <path d="M 60 30 L 74 46 L 66 46 L 66 58 L 54 58 L 54 46 L 46 46 Z" 
        fill="#00C2FF"/>

  <!-- Bold TP Monogram Mark -->
  <path d="M 44 60 L 76 60 L 76 68 L 64 68 L 64 86 L 56 86 L 56 68 L 44 68 Z" 
        fill="#FFFFFF"/>
  <path d="M 64 60 L 78 60 C 84 60 86 64 86 70 C 86 76 84 80 78 80 L 64 80 Z" 
        fill="none" 
        stroke="#00C2FF" 
        stroke-width="4"/>

  <!-- Active Telemetry Nodes -->
  <circle cx="60" cy="18" r="3" fill="#FFFFFF"/>
  <circle cx="92" cy="28" r="2.5" fill="#00C2FF"/>
  <circle cx="28" cy="28" r="2.5" fill="#00C2FF"/>
</svg>
