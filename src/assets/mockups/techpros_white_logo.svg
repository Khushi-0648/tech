<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient: Deep obsidian purple-black base -->
    <linearGradient id="tpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140d25"/>
      <stop offset="50%" stop-color="#0a0515"/>
      <stop offset="100%" stop-color="#05020a"/>
    </linearGradient>

    <!-- Outer Bezel / Border: Platinum silver to slate grey -->
    <linearGradient id="tpBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#CBD5E1" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#64748B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Pure White to Platinum Gradient for Primary T-Element -->
    <linearGradient id="tpWhitePlatinum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Silver to Cool Slate Grey for P-Element & Dimensional Facets -->
    <linearGradient id="tpSilverGrey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="55%" stop-color="#CBD5E1"/>
      <stop offset="80%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Dark Steel Grey for Depth & Shadow Facets -->
    <linearGradient id="tpDarkSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Radial Core Glow in White/Silver -->
    <radialGradient id="tpGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#CBD5E1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter for White Elements -->
    <filter id="tpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Base with Silver Hairline Stroke -->
  <rect x="2" y="2" width="116" height="116" rx="28" fill="url(#tpBg)"/>
  <rect x="2" y="2" width="116" height="116" rx="28" fill="none" stroke="url(#tpBorder)" stroke-width="2"/>

  <!-- Ambient Internal Silver Glow -->
  <circle cx="60" cy="60" r="48" fill="url(#tpGlow)"/>

  <!-- Tech Geometric Reticle / Telemetry Grid Marks in Muted Slate -->
  <g opacity="0.35">
    <circle cx="60" cy="60" r="46" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="16" y1="60" x2="22" y2="60" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="98" y1="60" x2="104" y2="60" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="60" y1="16" x2="60" y2="22" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="60" y1="98" x2="60" y2="104" stroke="#94A3B8" stroke-width="1.5"/>
  </g>

  <!-- === CENTRAL MONOGRAM & NETWORK APEX (White & Grey) === -->
  <g filter="url(#tpShadow)">
    
    <!-- 1. The Bold 'T' Element (Pure White with Platinum Chamfer) -->
    <!-- T Top Horizontal Bar (Left Section) -->
    <path d="M 26 32 L 62 32 L 62 44 L 38 44 L 26 32 Z" 
          fill="url(#tpWhitePlatinum)"/>
    
    <!-- T Vertical Stem (Descending Anchor) -->
    <path d="M 44 44 L 56 44 L 56 88 L 44 88 Z" 
          fill="url(#tpWhitePlatinum)"/>
    
    <!-- T Base Chamfer Foot (Grey Facet) -->
    <path d="M 44 88 L 56 88 L 52 92 L 40 92 Z" 
          fill="url(#tpDarkSteel)"/>

    <!-- 2. The Interlocking 'P' Element (Platinum Silver to Slate Grey) -->
    <!-- P Upper Crossbar & Sweeping Modern Loop -->
    <path d="M 64 32 L 84 32 C 93.94 32 98 37.5 98 47 C 98 56.5 93.94 62 84 62 L 64 62 L 64 44 L 82 44 C 85.5 44 87 45.2 87 47 C 87 48.8 85.5 50 82 50 L 64 50 L 64 32 Z" 
          fill="url(#tpSilverGrey)"/>

    <!-- P Inner Negative Counter Highlight (Obsidian inset with silver border) -->
    <rect x="64" y="44" width="18" height="6" fill="#0A0515" rx="1" opacity="0.6"/>

    <!-- 3. Isometric Circuit Interconnect (Grey & Silver Network Conduits) -->
    <!-- Conduits branching from T stem and P loop -->
    <path d="M 56 62 L 72 78 L 92 78" 
          fill="none" 
          stroke="url(#tpSilverGrey)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <path d="M 56 74 L 66 84 L 80 84" 
          fill="none" 
          stroke="#64748B" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- 4. Pure White & Chrome Telemetry Nodes (NOC Points) -->
    <!-- Apex Node on P Loop -->
    <circle cx="84" cy="32" r="3" fill="#FFFFFF" filter="url(#nodeGlow)"/>
    <!-- Central Pivot Node -->
    <circle cx="64" cy="32" r="2.5" fill="#CBD5E1"/>
    <!-- Left T Terminal Node -->
    <circle cx="26" cy="32" r="3" fill="#FFFFFF" filter="url(#nodeGlow)"/>
    <!-- Lower Right Circuit Terminal Node (Active White Ping) -->
    <circle cx="92" cy="78" r="4" fill="#FFFFFF" filter="url(#nodeGlow)"/>
    <circle cx="92" cy="78" r="2" fill="#CBD5E1"/>
    <!-- Secondary Lower Node -->
    <circle cx="80" cy="84" r="2.5" fill="#E2E8F0"/>
    <!-- Stem Base Anchor Node -->
    <circle cx="44" cy="88" r="2.5" fill="#94A3B8"/>

    <!-- 5. Technical Cyber Accents (Speed & Precision Lines) -->
    <line x1="28" y1="80" x2="36" y2="88" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="32" y1="72" x2="38" y2="78" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
